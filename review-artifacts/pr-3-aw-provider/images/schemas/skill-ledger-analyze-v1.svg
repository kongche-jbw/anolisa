  </defs>
  <rect width="1600" height="1057" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="993" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Skill Ledger analyze result/v1</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">PR 关联变更 · 非 AW Provider Contract</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">描述 Agent Sec Skill Ledger 的只读分析结果；本 PR 只修改了 $id 域名。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="277" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">top level</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">schema_version / engine_version</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">status：pass / warn / deny / error</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">coverage_complete：总体覆盖是否完整</tspan></text><circle cx="107" cy="442" r="4" fill="#1689a7"/><text x="122" y="449" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">scanners[]：各扫描器结果</tspan></text><circle cx="107" cy="483" r="4" fill="#1689a7"/><text x="122" y="490" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">errors[]：总体错误</tspan></text><rect x="70" y="545" width="900" height="154" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="587" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">scanner</tspan></text><line x1="100" y1="603" x2="940" y2="603" stroke="#d8e3ed"/><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">name / version / status / coverage_complete</tspan></text><circle cx="107" cy="661" r="4" fill="#1689a7"/><text x="122" y="668" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">findings[] / errors[]</tspan></text><rect x="70" y="723" width="900" height="154" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="765" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">finding / error</tspan></text><line x1="100" y1="781" x2="940" y2="781" stroke="#d8e3ed"/><circle cx="107" cy="798" r="4" fill="#1689a7"/><text x="122" y="805" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">finding：rule / level / message / file / line / metadata</tspan></text><circle cx="107" cy="839" r="4" fill="#1689a7"/><text x="122" y="846" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">error：code / message / file / metadata</tspan></text><rect x="1010" y="244" width="520" height="236" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">coverage_complete 与 status 分离，比 AW inspect</tspan><tspan x="1058" dy="27">输出更完整</tspan></text><circle cx="1043" cy="387" r="4" fill="#16845b"/><text x="1058" y="394" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">scanner 级结果保留独立版本和错误</tspan></text><circle cx="1043" cy="428" r="4" fill="#16845b"/><text x="1058" y="435" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">顶层与 scanner/error 默认拒绝额外字段</tspan></text><rect x="1010" y="504" width="520" height="304" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="546" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="562" x2="1504" y2="562" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="579" r="4" fill="#b76308"/><text x="1058" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">finding 没有 additionalProperties=false</tspan></text><circle cx="1043" cy="620" r="4" fill="#b76308"/><text x="1058" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">metadata 是无限制对象，不能声称 content-free</tspan></text><circle cx="1043" cy="661" r="4" fill="#b76308"/><text x="1058" y="668" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">status 与 coverage_complete、findings</tspan><tspan x="1058" dy="27">之间仍无一致性条件</tspan></text><circle cx="1043" cy="729" r="4" fill="#b76308"/><text x="1058" y="736" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">这份 Schema 不参与 Provider 路由，不能与 AW</tspan><tspan x="1058" dy="27">canonical Schema 混为一谈</tspan></text></g>
