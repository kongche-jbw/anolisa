s SC', system-ui, sans-serif"><tspan x="1058" dy="0">是否保留低置信度结果由调用方明确给出</tspan></text><rect x="1010" y="477" width="520" height="263" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="519" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="535" x2="1504" y2="535" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="552" r="4" fill="#b76308"/><text x="1058" y="559" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Schema 允许 pre_tool，但当前 Tool Result</tspan><tspan x="1058" dy="27">调用只实现 post_tool</tspan></text><circle cx="1043" cy="620" r="4" fill="#b76308"/><text x="1058" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">缺少正文的规范字节域，COSH 当前先脱敏后扫描</tspan></text><circle cx="1043" cy="661" r="4" fill="#b76308"/><text x="1058" y="668" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">artifact、tool_name 的 Schema 与 Rust</tspan><tspan x="1058" dy="27">类型限制不一致</tspan></text></g>
