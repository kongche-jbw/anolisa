="122" dy="0">severity / confidence</tspan></text><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">count</tspan></text><rect x="1010" y="244" width="520" height="236" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">决策值是封闭枚举，Core 映射明确</tspan></text><circle cx="1043" cy="360" r="4" fill="#16845b"/><text x="1058" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">reason 使用代码而不是泄露命令原文</tspan></text><circle cx="1043" cy="401" r="4" fill="#16845b"/><text x="1058" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Provider 的 deny 与 Host disposition=denied</tspan><tspan x="1058" dy="27">被清楚区分</tspan></text><rect x="1010" y="504" width="520" height="304" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="546" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="562" x2="1504" y2="562" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="579" r="4" fill="#b76308"/><text x="1058" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">allow 可以同时携带 deny reason 和 critical</tspan><tspan x="1058" dy="27">finding</tspan></text><circle cx="1043" cy="647" r="4" fill="#b76308"/><text x="1058" y="654" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">warn / deny 可以没有 reason</tspan></text><circle cx="1043" cy="688" r="4" fill="#b76308"/><text x="1058" y="695" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">没有 truncated、coverage 或 detected</tspan><tspan x="1058" dy="27">language，无法证明 allow 来自完整扫描</tspan></text><circle cx="1043" cy="756" r="4" fill="#b76308"/><text x="1058" y="763" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">reasons 与 findings 之间没有引用一致性规则</tspan></text></g>
