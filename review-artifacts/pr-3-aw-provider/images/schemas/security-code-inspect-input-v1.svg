-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="535" x2="1504" y2="535" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="552" r="4" fill="#b76308"/><text x="1058" y="559" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">当前 Agent Sec 把 auto 固定当</tspan><tspan x="1058" dy="27">Bash，并不做自动识别</tspan></text><circle cx="1043" cy="620" r="4" fill="#b76308"/><text x="1058" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Core 固定发送 auto，普通 Python 可能得到错误</tspan><tspan x="1058" dy="27">clean</tspan></text><circle cx="1043" cy="688" r="4" fill="#b76308"/><text x="1058" y="695" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">无法识别语言时没有规定必须降级还是可以继续给结论</tspan></text></g>
