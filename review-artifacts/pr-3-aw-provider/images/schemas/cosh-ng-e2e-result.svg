  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1235" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="1171" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">COSH-NG E2E result</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">PR 关联变更 · 非 AW Provider Contract</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">记录 COSH-NG 分阶段 E2E 结果；它是测试证据容器，不参与 Provider 生效链。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">run</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">schema_version / run_id / profile</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">started_at / finished_at</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">environment：运行环境自由对象</tspan></text><rect x="70" y="463" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="505" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">artifact</tspan></text><line x1="100" y1="521" x2="940" y2="521" stroke="#d8e3ed"/><circle cx="107" cy="538" r="4" fill="#1689a7"/><text x="122" y="545" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">path：被测产物路径</tspan></text><circle cx="107" cy="579" r="4" fill="#1689a7"/><text x="122" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">sha256：产物摘要</tspan></text><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">git_sha：源码提交</tspan></text><rect x="70" y="682" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="724" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">cases[]</tspan></text><line x1="100" y1="740" x2="940" y2="740" stroke="#d8e3ed"/><circle cx="107" cy="757" r="4" fill="#1689a7"/><text x="122" y="764" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">id / status / attempts</tspan></text><circle cx="107" cy="798" r="4" fill="#1689a7"/><text x="122" y="805" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">started_at / finished_at</tspan></text><circle cx="107" cy="839" r="4" fill="#1689a7"/><text x="122" y="846" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">evidence[] / reason / metrics</tspan></text><rect x="70" y="901" width="900" height="154" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="943" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">cleanup</tspan></text><line x1="100" y1="959" x2="940" y2="959" stroke="#d8e3ed"/><circle cx="107" cy="976" r="4" fill="#1689a7"/><text x="122" y="983" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">status：PASS / FAIL</tspan></text><circle cx="107" cy="1017" r="4" fill="#1689a7"/><text x="122" y="1024" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">actions[]：清理动作说明</tspan></text><rect x="1010" y="244" width="520" height="250" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">测试运行、产物、case 与 cleanup 分层清楚</tspan></text><circle cx="1043" cy="360" r="4" fill="#16845b"/><text x="1058" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">产物绑定 SHA-256，case 状态使用封闭枚举</tspan></text><circle cx="1043" cy="401" r="4" fill="#16845b"/><text x="1058" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">主要结构拒绝未知字段</tspan></text><circle cx="1043" cy="442" r="4" fill="#16845b"/><text x="1058" y="449" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">适合承载最终 VM E2E 证据，但不替代运行契约</tspan></text><rect x="1010" y="518" width="520" height="304" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="560" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="576" x2="1504" y2="576" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="593" r="4" fill="#b76308"/><text x="1058" y="600" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">environment 与 metrics 是无约束对象</tspan></text><circle cx="1043" cy="634" r="4" fill="#b76308"/><text x="1058" y="641" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">attempts 允许 0，是否代表未执行需另行约定</tspan></text><circle cx="1043" cy="675" r="4" fill="#b76308"/><text x="1058" y="682" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">时间先后、cleanup 与 case 状态关系无法由 Schema</tspan><tspan x="1058" dy="27">单独保证</tspan></text><circle cx="1043" cy="743" r="4" fill="#b76308"/><text x="1058" y="750" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">AW Ledger 也不由此 Schema 定义；它使用独立 Rust</tspan><tspan x="1058" dy="27">typed record 与校验器</tspan></text></g>
  <text x="70" y="1114" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">src/cosh-ng/e2e/result.schema.json</tspan></text>
  <text x="70" y="1177" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">物理副本：无</tspan></text>
  <text x="1530" y="1177" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR 42d07649 + PoC 5ebfc0b3 · 绿色=当前合理，橙色=仍需讨论</tspan></text>
