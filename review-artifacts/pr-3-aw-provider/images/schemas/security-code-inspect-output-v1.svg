  <title id="title">security.code.inspect/v1 输出</title>
  <desc id="desc">字段、语义、合理点和讨论点。审查固定到 42d07649409ecd5bb023056b28545efbd9325ef2。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1010" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="946" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">security.code.inspect/v1 输出</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">AW canonical · Observe</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">返回代码风险 finding、扫描覆盖情况和实际分析语言。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="236" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">inspection summary</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">verdict：clean / suspicious / sensitive</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">scanned_bytes：已扫描字节数</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">truncated：是否未扫描完整</tspan></text><circle cx="107" cy="442" r="4" fill="#1689a7"/><text x="122" y="449" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">language_detected：bash / python / unknown，可选</tspan></text><rect x="70" y="504" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="546" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">findings[] · 最多 64</tspan></text><line x1="100" y1="562" x2="940" y2="562" stroke="#d8e3ed"/><circle cx="107" cy="579" r="4" fill="#1689a7"/><text x="122" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">rule_id / category：规则与类别</tspan></text><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">severity / confidence：严重程度与可信程度</tspan></text><circle cx="107" cy="661" r="4" fill="#1689a7"/><text x="122" y="668" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">count：同类命中次数</tspan></text><rect x="1010" y="244" width="520" height="209" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">输出实际分析语言，便于调用方判断结论适用范围</tspan></text><circle cx="1043" cy="360" r="4" fill="#16845b"/><text x="1058" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">finding 结构与 content inspect 一致</tspan></text><circle cx="1043" cy="401" r="4" fill="#16845b"/><text x="1058" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">未知字段默认拒绝</tspan></text><rect x="1010" y="477" width="520" height="290" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="519" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="535" x2="1504" y2="535" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="552" r="4" fill="#b76308"/><text x="1058" y="559" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">危险代码被映射成</tspan><tspan x="1058" dy="27">sensitive，内容敏感与执行风险语义混用</tspan></text><circle cx="1043" cy="620" r="4" fill="#b76308"/><text x="1058" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">language_detected=unknown 或 truncated=true</tspan><tspan x="1058" dy="27">仍可给 clean</tspan></text><circle cx="1043" cy="688" r="4" fill="#b76308"/><text x="1058" y="695" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">verdict 与 findings、count、coverage</tspan><tspan x="1058" dy="27">没有一致性约束</tspan></text></g>
