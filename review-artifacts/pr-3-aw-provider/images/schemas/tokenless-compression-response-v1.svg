Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">before_tokens / after_tokens：估算值</tspan></text><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">tokenizer_id：计数方法</tspan></text><rect x="70" y="682" width="900" height="236" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="724" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">optional detail</tspan></text><line x1="100" y1="740" x2="940" y2="740" stroke="#d8e3ed"/><circle cx="107" cy="757" r="4" fill="#1689a7"/><text x="122" y="764" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content_type：检测到的内容分类</tspan></text><circle cx="107" cy="798" r="4" fill="#1689a7"/><text x="122" y="805" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">compressor_chain[]：转换链</tspan></text><circle cx="107" cy="839" r="4" fill="#1689a7"/><text x="122" y="846" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">stash_keys[]：可恢复内容引用</tspan></text><circle cx="107" cy="880" r="4" fill="#1689a7"/><text x="122" y="887" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">diagnostic：错误诊断</tspan></text><rect x="1010" y="244" width="520" height="209" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan 