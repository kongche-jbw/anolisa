<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1245" viewBox="0 0 1600 1245" role="img" aria-labelledby="title desc">
  <title id="title">Tokenless CompressionResponse/v1</title>
  <desc id="desc">字段、语义、已修正的合理点和仍需讨论的边界。对照原 PR 42d07649409ecd5bb023056b28545efbd9325ef2 与 fork PoC 5ebfc0b3905fa2f5f74aff2da4aec2b3be639647。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1245" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="1181" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Tokenless CompressionResponse/v1</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Provider native · Tokenless</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">返回实际响应正文、对应媒体类型、处置、可恢复性与同方法 token 估计。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="222" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">required result</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">output / output_media_type：本次实际返回正文与表示</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">disposition：applied / dry_run / passthrough / no_savings / timeout / error 等</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">compressor_chain / reversibility / stash_keys：转换与恢复事实</tspan></text><rect x="70" y="490" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="532" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">measurement</tspan></text><line x1="100" y1="548" x2="940" y2="548" stroke="#d8e3ed"/><circle cx="107" cy="565" r="4" fill="#1689a7"/><text x="122" y="572" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">before_tokens / after_tokens：同一次估算</tspan></text><circle cx="107" cy="606" r="4" fill="#1689a7"/><text x="122" y="613" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">tokenizer_id：计数方法身份</tspan></text><circle cx="107" cy="647" r="4" fill="#1689a7"/><text x="122" y="654" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content_type / diagnostic：可选细类或错误说明</tspan></text><rect x="70" y="709" width="900" height="263" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="751" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">state constraints</tspan></text><line x1="100" y1="767" x2="940" y2="767" stroke="#d8e3ed"/><circle cx="107" cy="784" r="4" fill="#1689a7"/><text x="122" y="791" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">applied：output 才是变换后正文，可映射为 candidate</tspan></text><circle cx="107" cy="825" r="4" fill="#1689a7"/><text x="122" y="832" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">dry_run：保留 source output，仅报告模拟转换计量</tspan></text><circle cx="107" cy="866" r="4" fill="#1689a7"/><text x="122" y="873" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">其他状态：保留 source output；passthrough / failure 固定 lossless 且</tspan><tspan x="122" dy="27">chain、stash 为空</tspan></text><circle cx="107" cy="934" r="4" fill="#1689a7"/><text x="122" y="941" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">retrievable 必须有 stash key；非 error 禁止 diagnostic</tspan></text><rect x="1010" y="244" width="520" height="358" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">output_media_type 使实际返回正文的表示可以被</tspan><tspan x="1058" dy="27">Host 验证</tspan></text><circle cx="1043" cy="387" r="4" fill="#16845b"/><text x="1058" y="394" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">状态机约束已覆盖</tspan><tspan x="1058" dy="27">disposition、chain、reversibility、stash 与</tspan><tspan x="1058" dy="27">diagnostic</tspan></text><circle cx="1043" cy="482" r="4" fill="#16845b"/><text x="1058" y="489" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">顶层拒绝未知字段，diagnostic 最多 4096 字符</tspan></text><circle cx="1043" cy="523" r="4" fill="#16845b"/><text x="1058" y="530" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">仅 applied 分支由 manifest 把 output 与</tspan><tspan x="1058" dy="27">output_media_type 映射为 canonical candidate</tspan></text><rect x="1010" y="626" width="520" height="331" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="668" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="684" x2="1504" y2="684" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="701" r="4" fill="#b76308"/><text x="1058" y="708" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">error 尚未强制 diagnostic，失败诊断仍可能缺失</tspan></text><circle cx="1043" cy="742" r="4" fill="#b76308"/><text x="1058" y="749" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">before_tokens 与 after_tokens 的大小关系未由</tspan><tspan x="1058" dy="27">Schema 约束</tspan></text><circle cx="1043" cy="810" r="4" fill="#b76308"/><text x="1058" y="817" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">compressor_chain、stash_keys 和部分标识没有</tspan><tspan x="1058" dy="27">maxItems 或字符串上界</tspan></text><circle cx="1043" cy="878" r="4" fill="#b76308"/><text x="1058" y="885" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">响应 Schema 无法跨消息证明 dry_run / 其他状态的</tspan><tspan x="1058" dy="27">output 等于 source；需 Provider 与 Host 校验</tspan></text></g>
  <text x="70" y="1124" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">providers/tokenless/schemas/tokenless-compression-response-v1.schema.json</tspan></text>
  <text x="70" y="1187" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">物理副本：无</tspan></text>
  <text x="1530" y="1187" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR 42d07649 + PoC 5ebfc0b3 · 绿色=当前合理，橙色=仍需讨论</tspan></text>
</svg>
