<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1164" viewBox="0 0 1600 1164" role="img" aria-labelledby="title desc">
  <title id="title">context.projection.prepare/v1 输入</title>
  <desc id="desc">字段、语义、已修正的合理点和仍需讨论的边界。对照原 PR 42d07649409ecd5bb023056b28545efbd9325ef2 与 fork PoC 5ebfc0b3905fa2f5f74aff2da4aec2b3be639647。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1164" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="1100" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">context.projection.prepare/v1 输入</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">AW canonical · Advise</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">把即将写入模型历史的不可变 Tool Result 作为 Provider 无关输入提交给 Context Projection。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="318" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">artifact · 必填</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">id：40 字符 art_ UUID 身份</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">digest：content UTF-8 字节的 SHA-256</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content：瞬时 Provider 输入正文</tspan></text><circle cx="107" cy="442" r="4" fill="#1689a7"/><text x="122" y="449" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">media_type：1–128 字节可打印 ASCII</tspan></text><circle cx="107" cy="483" r="4" fill="#1689a7"/><text x="122" y="490" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">origin：command_output / file_content / api_response / unspecified</tspan></text><circle cx="107" cy="524" r="4" fill="#1689a7"/><text x="122" y="531" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">tool_name：可选，1–128 字节可打印 ASCII</tspan></text><rect x="70" y="586" width="900" height="154" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="628" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">boundary · 必填</tspan></text><line x1="100" y1="644" x2="940" y2="644" stroke="#d8e3ed"/><circle cx="107" cy="661" r="4" fill="#1689a7"/><text x="122" y="668" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">before_model / pre_tool / post_tool / proxy</tspan></text><circle cx="107" cy="702" r="4" fill="#1689a7"/><text x="122" y="709" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">当前 PoC 的 Tool Result 路径使用 post_tool</tspan></text><rect x="70" y="764" width="900" height="113" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="806" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">constraints · 必填</tspan></text><line x1="100" y1="822" x2="940" y2="822" stroke="#d8e3ed"/><circle cx="107" cy="839" r="4" fill="#1689a7"/><text x="122" y="846" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">allow_text_reencoding：能否改变源媒体表示</tspan></text><rect x="1010" y="244" width="520" height="331" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">artifact 身份、摘要、媒体类型和正文处于同一</tspan><tspan x="1058" dy="27">canonical 对象</tspan></text><circle cx="1043" cy="387" r="4" fill="#16845b"/><text x="1058" y="394" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Schema 与 Rust 的 ArtifactId、BoundedName</tspan><tspan x="1058" dy="27">长度现已对齐</tspan></text><circle cx="1043" cy="455" r="4" fill="#16845b"/><text x="1058" y="462" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Core 从提交正文计算 digest，并在 false</tspan><tspan x="1058" dy="27">时拒绝媒体类型变化</tspan></text><circle cx="1043" cy="523" r="4" fill="#16845b"/><text x="1058" y="530" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">所有对象拒绝未知字段</tspan></text><rect x="1010" y="599" width="520" height="358" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="641" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="657" x2="1504" y2="657" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="674" r="4" fill="#b76308"/><text x="1058" y="681" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">JSON Schema 不能独自证明 digest 等于</tspan><tspan x="1058" dy="27">content；可信保证来自 Core 构造</tspan></text><circle cx="1043" cy="742" r="4" fill="#b76308"/><text x="1058" y="749" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">除 post_tool 外的 boundary</tspan><tspan x="1058" dy="27">仍是协议预留，并非当前运行能力</tspan></text><circle cx="1043" cy="810" r="4" fill="#b76308"/><text x="1058" y="817" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">media_type 与 origin 由 Environment</tspan><tspan x="1058" dy="27">声明，仍需明确可信来源与纠错责任</tspan></text><circle cx="1043" cy="878" r="4" fill="#b76308"/><text x="1058" y="885" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">content 的全局尺寸上限由 Host budget</tspan><tspan x="1058" dy="27">承担，未写进能力 Schema</tspan></text></g>
  <text x="70" y="1043" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">src/aw/crates/aw-contracts/schemas/context-projection-prepare-input-v1.schema.json</tspan></text>
  <text x="70" y="1106" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">物理副本：providers/tokenless/schemas/context-projection-prepare-input-v1.schema.json</tspan></text>
  <text x="1530" y="1106" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR 42d07649 + PoC 5ebfc0b3 · 绿色=当前合理，橙色=仍需讨论</tspan></text>
</svg>
