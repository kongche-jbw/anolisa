<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1069" viewBox="0 0 1600 1069" role="img" aria-labelledby="title desc">
  <title id="title">context.projection.prepare/v1 输入</title>
  <desc id="desc">字段、语义、合理点和讨论点。审查固定到 42d07649409ecd5bb023056b28545efbd9325ef2。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1069" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="1005" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">context.projection.prepare/v1 输入</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">AW canonical · Advise</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">把一份不可变、即将进入模型的 Tool Result 交给 Context Projection Provider。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="318" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">artifact · 必填</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">id：AW 分配的 artifact 身份</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">digest：content 的 SHA-256</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content：Provider 实际处理的字符串</tspan></text><circle cx="107" cy="442" r="4" fill="#1689a7"/><text x="122" y="449" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">media_type：输入内容类型</tspan></text><circle cx="107" cy="483" r="4" fill="#1689a7"/><text x="122" y="490" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">origin：command_output / file_content / api_response / unspecified</tspan></text><circle cx="107" cy="524" r="4" fill="#1689a7"/><text x="122" y="531" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">tool_name：可选工具名</tspan></text><rect x="70" y="586" width="900" height="154" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="628" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">boundary · 必填</tspan></text><line x1="100" y1="644" x2="940" y2="644" stroke="#d8e3ed"/><circle cx="107" cy="661" r="4" fill="#1689a7"/><text x="122" y="668" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">before_model / pre_tool / post_tool / proxy</tspan></text><circle cx="107" cy="702" r="4" fill="#1689a7"/><text x="122" y="709" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">描述能力在哪个 Agent 边界被调用</tspan></text><rect x="70" y="764" width="900" height="113" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="806" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">constraints · 必填</tspan></text><line x1="100" y1="822" x2="940" y2="822" stroke="#d8e3ed"/><circle cx="107" cy="839" r="4" fill="#1689a7"/><text x="122" y="846" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">allow_text_reencoding：是否允许改成文本表示</tspan></text><rect x="1010" y="244" width="520" height="236" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">source identity、摘要和正文放在同一对象中</tspan></text><circle cx="1043" cy="360" r="4" fill="#16845b"/><text x="1058" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Provider 收到的是能力语义，不是 COSH Hook</tspan><tspan x="1058" dy="27">私有结构</tspan></text><circle cx="1043" cy="428" r="4" fill="#16845b"/><text x="1058" y="435" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">未知字段默认拒绝</tspan></text><rect x="1010" y="504" width="520" height="358" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="546" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="562" x2="1504" y2="562" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="579" r="4" fill="#b76308"/><text x="1058" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">当前 Core 只产生 post_tool，其他 boundary</tspan><tspan x="1058" dy="27">是未实现未来态</tspan></text><circle cx="1043" cy="647" r="4" fill="#b76308"/><text x="1058" y="654" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">content 已经是 JSON string，text re-encoding</tspan><tspan x="1058" dy="27">的源表示不清楚</tspan></text><circle cx="1043" cy="715" r="4" fill="#b76308"/><text x="1058" y="722" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">tool_name 允许 256 字符，Rust 只允许 128 UTF-8</tspan><tspan x="1058" dy="27">bytes</tspan></text><circle cx="1043" cy="783" r="4" fill="#b76308"/><text x="1058" y="790" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Schema 未表达 digest 必须等于 content 的 UTF-8</tspan><tspan x="1058" dy="27">摘要</tspan></text></g>
  <text x="70" y="948" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">src/aw/crates/aw-contracts/schemas/context-projection-prepare-input-v1.schema.json</tspan></text>
  <text x="70" y="1011" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">物理副本：providers/tokenless/schemas/context-projection-prepare-input-v1.schema.json</tspan></text>
  <text x="1530" y="1011" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR head 42d07649 · 绿色表示可保留，橙色表示冻结前需讨论</tspan></text>
</svg>
