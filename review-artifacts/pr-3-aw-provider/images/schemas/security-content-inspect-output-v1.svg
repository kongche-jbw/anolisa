<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1218" viewBox="0 0 1600 1218" role="img" aria-labelledby="title desc">
  <title id="title">security.content.inspect/v1 输出</title>
  <desc id="desc">字段、语义、已修正的合理点和仍需讨论的边界。对照原 PR 42d07649409ecd5bb023056b28545efbd9325ef2 与 fork PoC 5ebfc0b3905fa2f5f74aff2da4aec2b3be639647。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1218" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="1154" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">security.content.inspect/v1 输出</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">AW canonical · Observe</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">返回不包含命中原文的完整扫描结论，或只声明已扫描前缀中发现的风险事实。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">inspection summary</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">verdict：clean / suspicious / sensitive</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">scanned_bytes：实际检查的 UTF-8 字节数</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">truncated：是否只检查严格非空前缀</tspan></text><rect x="70" y="463" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="505" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">findings[] · 最多 64</tspan></text><line x1="100" y1="521" x2="940" y2="521" stroke="#d8e3ed"/><circle cx="107" cy="538" r="4" fill="#1689a7"/><text x="122" y="545" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">rule_id / category：规则与分类</tspan></text><circle cx="107" cy="579" r="4" fill="#1689a7"/><text x="122" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">severity / confidence：严重度与可信度</tspan></text><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">count：命中数，范围 1..u32::MAX</tspan></text><rect x="1010" y="244" width="520" height="331" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">clean 必须无 finding 且 truncated=false</tspan></text><circle cx="1043" cy="360" r="4" fill="#16845b"/><text x="1058" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">suspicious / sensitive 必须至少有一个 finding</tspan></text><circle cx="1043" cy="401" r="4" fill="#16845b"/><text x="1058" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Core</tspan><tspan x="1058" dy="27">要求完整结果扫描字节数等于输入；截断风险只允许严</tspan><tspan x="1058" dy="27">格非空前缀</tspan></text><circle cx="1043" cy="496" r="4" fill="#16845b"/><text x="1058" y="503" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">receipt meter 的 id、unit、measurement_kind</tspan><tspan x="1058" dy="27">与数值都会由 Core 核对</tspan></text><rect x="1010" y="599" width="520" height="358" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="641" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="657" x2="1504" y2="657" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="674" r="4" fill="#b76308"/><text x="1058" y="681" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">truncated</tspan><tspan x="1058" dy="27">风险只证明已扫描前缀中的命中，不能对未扫描尾部下</tspan><tspan x="1058" dy="27">结论</tspan></text><circle cx="1043" cy="769" r="4" fill="#b76308"/><text x="1058" y="776" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">verdict 与 finding severity 的汇总规则尚未标准化</tspan></text><circle cx="1043" cy="810" r="4" fill="#b76308"/><text x="1058" y="817" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Schema 允许相同 rule_id</tspan><tspan x="1058" dy="27">重复出现；是否必须聚合为一项仍需决定</tspan></text><circle cx="1043" cy="878" r="4" fill="#b76308"/><text x="1058" y="885" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">rule_id 虽然有边界，仍需治理跨 Provider</tspan><tspan x="1058" dy="27">的稳定命名空间</tspan></text></g>
  <text x="70" y="1097" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">src/aw/crates/aw-contracts/schemas/security-content-inspect-output-v1.schema.json</tspan></text>
  <text x="70" y="1160" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">物理副本：providers/agent-sec-core/schemas/security-content-inspect-output-v1.schema.json</tspan></text>
  <text x="1530" y="1160" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR 42d07649 + PoC 5ebfc0b3 · 绿色=当前合理，橙色=仍需讨论</tspan></text>
</svg>
