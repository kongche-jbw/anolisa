<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1191" viewBox="0 0 1600 1191" role="img" aria-labelledby="title desc">
  <title id="title">Agent Sec native response/v1</title>
  <desc id="desc">字段、语义、已修正的合理点和仍需讨论的边界。对照原 PR 42d07649409ecd5bb023056b28545efbd9325ef2 与 fork PoC 5ebfc0b3905fa2f5f74aff2da4aec2b3be639647。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1191" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="1127" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Agent Sec native response/v1</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Provider native · Agent Sec</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">用 operation 与 disposition 双重判别返回已完成、跳过或失败的 content-free 结果。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="236" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">顶层判别与计量</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">protocol_version：固定 1</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">operation：content_inspect / code_inspect / command_inspect</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">disposition：completed / skipped / error</tspan></text><circle cx="107" cy="442" r="4" fill="#1689a7"/><text x="122" y="449" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">findings_total / scanned_bytes：顶层 observed meter 来源</tspan></text><rect x="70" y="504" width="900" height="236" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="546" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">completed 顶层字段</tspan></text><line x1="100" y1="562" x2="940" y2="562" stroke="#d8e3ed"/><circle cx="107" cy="579" r="4" fill="#1689a7"/><text x="122" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content：verdict / findings / truncated / engine</tspan></text><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">code：verdict / findings / truncated / language_detected / engine</tspan></text><circle cx="107" cy="661" r="4" fill="#1689a7"/><text x="122" y="668" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">command：verdict / findings / reasons / language_detected / engine</tspan></text><circle cx="107" cy="702" r="4" fill="#1689a7"/><text x="122" y="709" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">不存在 inspection 或 gate 包装对象</tspan></text><rect x="70" y="764" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="806" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">其他顶层分支</tspan></text><line x1="100" y1="822" x2="940" y2="822" stroke="#d8e3ed"/><circle cx="107" cy="839" r="4" fill="#1689a7"/><text x="122" y="846" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">skipped：findings_total=0 / scanned_bytes=0 / skip_reason</tspan></text><circle cx="107" cy="880" r="4" fill="#1689a7"/><text x="122" y="887" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">error：findings_total=0 / scanned_bytes / error_code</tspan></text><circle cx="107" cy="921" r="4" fill="#1689a7"/><text x="122" y="928" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">每一分支都 additionalProperties=false</tspan></text><rect x="1010" y="244" width="520" height="331" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">operation 与 disposition 共同决定合法字段和值域</tspan></text><circle cx="1043" cy="360" r="4" fill="#16845b"/><text x="1058" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">completed 的 verdict、finding</tspan><tspan x="1058" dy="27">与覆盖关系已受条件约束</tspan></text><circle cx="1043" cy="428" r="4" fill="#16845b"/><text x="1058" y="435" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">skipped 固定 0 meter，error 只能返回</tspan><tspan x="1058" dy="27">scanner_failed</tspan></text><circle cx="1043" cy="496" r="4" fill="#16845b"/><text x="1058" y="503" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Host 校验 schema、operation correlation，并由</tspan><tspan x="1058" dy="27">Core核对 meter 数值</tspan></text><rect x="1010" y="599" width="520" height="358" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="641" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="657" x2="1504" y2="657" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="674" r="4" fill="#b76308"/><text x="1058" y="681" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">error 可报告已扫描字节，但不携带 partial</tspan><tspan x="1058" dy="27">finding，因此不能当作观察事实</tspan></text><circle cx="1043" cy="742" r="4" fill="#b76308"/><text x="1058" y="749" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">native findings_total 与 findings</tspan><tspan x="1058" dy="27">求和的最终一致性由 Core meter 校验承担</tspan></text><circle cx="1043" cy="810" r="4" fill="#b76308"/><text x="1058" y="817" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">error_code 当前只有</tspan><tspan x="1058" dy="27">scanner_failed，故障分类粒度较粗</tspan></text><circle cx="1043" cy="878" r="4" fill="#b76308"/><text x="1058" y="885" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">engine 使用 const，新增扫描引擎需要协议或</tspan><tspan x="1058" dy="27">schema 演进</tspan></text></g>
  <text x="70" y="1070" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">providers/agent-sec-core/schemas/agent-sec-aw-provider-response-v1.schema.json</tspan></text>
  <text x="70" y="1133" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">物理副本：无</tspan></text>
  <text x="1530" y="1133" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR 42d07649 + PoC 5ebfc0b3 · 绿色=当前合理，橙色=仍需讨论</tspan></text>
</svg>
