<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1245" viewBox="0 0 1600 1245" role="img" aria-labelledby="title desc">
  <title id="title">Agent Sec native request/v1</title>
  <desc id="desc">字段、语义、已修正的合理点和仍需讨论的边界。对照原 PR 42d07649409ecd5bb023056b28545efbd9325ef2 与 fork PoC 5ebfc0b3905fa2f5f74aff2da4aec2b3be639647。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1245" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="1181" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Agent Sec native request/v1</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Provider native · Agent Sec</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">以一个 stdin 协议承载三种操作，并用 operation 分支只接收各自需要的字段。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">oneOf dispatch · 必填</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content_inspect：content + source + include_low_confidence</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">code_inspect：content + language</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">command_inspect：content + language</tspan></text><rect x="70" y="463" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="505" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">shared identity</tspan></text><line x1="100" y1="521" x2="940" y2="521" stroke="#d8e3ed"/><circle cx="107" cy="538" r="4" fill="#1689a7"/><text x="122" y="545" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">protocol_version：固定为 1</tspan></text><circle cx="107" cy="579" r="4" fill="#1689a7"/><text x="122" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">operation：请求分支 discriminator</tspan></text><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content：从 canonical input 原样映射</tspan></text><rect x="1010" y="244" width="520" height="304" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">request 已按 operation 使用 oneOf</tspan><tspan x="1058" dy="27">判别，不再依赖隐式默认字段</tspan></text><circle cx="1043" cy="387" r="4" fill="#16845b"/><text x="1058" y="394" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">每个分支拒绝未知字段并要求自己的完整参数</tspan></text><circle cx="1043" cy="428" r="4" fill="#16845b"/><text x="1058" y="435" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Host 会按 admitted digest 校验 native request</tspan><tspan x="1058" dy="27">实例</tspan></text><circle cx="1043" cy="496" r="4" fill="#16845b"/><text x="1058" y="503" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">native 协议与 AW canonical 权限语义保持解耦</tspan></text><rect x="1010" y="572" width="520" height="358" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="614" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="630" x2="1504" y2="630" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="647" r="4" fill="#b76308"/><text x="1058" y="654" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">code_inspect 与 command_inspect 字段相同，但</tspan><tspan x="1058" dy="27">authority 完全不同，必须保留 operation</tspan></text><circle cx="1043" cy="715" r="4" fill="#b76308"/><text x="1058" y="722" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">content 大小主要由 Host input budget</tspan><tspan x="1058" dy="27">限制，native Schema 本身不设 maxLength</tspan></text><circle cx="1043" cy="783" r="4" fill="#b76308"/><text x="1058" y="790" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">source 词表比 canonical origin 更宽，当前</tspan><tspan x="1058" dy="27">manifest 固定映射 tool_output</tspan></text><circle cx="1043" cy="851" r="4" fill="#b76308"/><text x="1058" y="858" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">protocol v1 的未来新增字段需要明确兼容策略与</tspan><tspan x="1058" dy="27">schema version 规则</tspan></text></g>
  <text x="70" y="1124" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">providers/agent-sec-core/schemas/agent-sec-aw-provider-request-v1.schema.json</tspan></text>
  <text x="70" y="1187" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">物理副本：无</tspan></text>
  <text x="1530" y="1187" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR 42d07649 + PoC 5ebfc0b3 · 绿色=当前合理，橙色=仍需讨论</tspan></text>
</svg>
