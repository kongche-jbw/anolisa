<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc">
  <title id="title">Agent Sec native request/v1</title>
  <desc id="desc">字段、语义、合理点和讨论点。审查固定到 42d07649409ecd5bb023056b28545efbd9325ef2。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1010" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="946" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Agent Sec native request/v1</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Provider native · Agent Sec</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">一个进程入口承载 content、code、command 三类 Agent Sec 操作。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">dispatch · 必填</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">protocol_version：固定为 1</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">operation：content_inspect / code_inspect / command_inspect</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content：实际扫描文本</tspan></text><rect x="70" y="463" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="505" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">operation options</tspan></text><line x1="100" y1="521" x2="940" y2="521" stroke="#d8e3ed"/><circle cx="107" cy="538" r="4" fill="#1689a7"/><text x="122" y="545" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">source：内容来源，默认 unknown</tspan></text><circle cx="107" cy="579" r="4" fill="#1689a7"/><text x="122" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">include_low_confidence：PII 扫描选项</tspan></text><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">language：auto / bash / python</tspan></text><rect x="1010" y="244" width="520" height="209" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">native protocol 与 AW canonical contract 解耦</tspan></text><circle cx="1043" cy="360" r="4" fill="#16845b"/><text x="1058" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">单一入口适合复用 Agent Sec 现有 Python scanner</tspan></text><circle cx="1043" cy="401" r="4" fill="#16845b"/><text x="1058" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">额外字段被拒绝</tspan></text><rect x="1010" y="477" width="520" height="263" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="519" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="535" x2="1504" y2="535" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="552" r="4" fill="#b76308"/><text x="1058" y="559" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">没有按 operation 条件要求对应字段</tspan></text><circle cx="1043" cy="593" r="4" fill="#b76308"/><text x="1058" y="600" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">command_inspect 缺 language 也能通过 Schema</tspan><tspan x="1058" dy="27">并依赖默认 auto</tspan></text><circle cx="1043" cy="661" r="4" fill="#b76308"/><text x="1058" y="668" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">protocol_version 在 Pydantic 类型中只是</tspan><tspan x="1058" dy="27">int，版本一致性另行手写检查</tspan></text></g>
  <text x="70" y="889" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">providers/agent-sec-core/schemas/agent-sec-aw-provider-request-v1.schema.json</tspan></text>
  <text x="70" y="952" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">物理副本：无</tspan></text>
  <text x="1530" y="952" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR head 42d07649 · 绿色表示可保留，橙色表示冻结前需讨论</tspan></text>
