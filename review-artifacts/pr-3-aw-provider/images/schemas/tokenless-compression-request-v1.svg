<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1245" viewBox="0 0 1600 1245" role="img" aria-labelledby="title desc">
  <title id="title">Tokenless CompressionRequest/v1</title>
  <desc id="desc">字段、语义、已修正的合理点和仍需讨论的边界。对照原 PR 42d07649409ecd5bb023056b28545efbd9325ef2 与 fork PoC 5ebfc0b3905fa2f5f74aff2da4aec2b3be639647。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1245" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="1181" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Tokenless CompressionRequest/v1</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Provider native · Tokenless</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">向真实 Tokenless 入口提交源正文、源媒体类型、调用边界与替换能力。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="236" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">required</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">protocol_version：固定为 1</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content：与 canonical artifact 相同的正文</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">agent_id：manifest const aw-provider</tspan></text><circle cx="107" cy="442" r="4" fill="#1689a7"/><text x="122" y="449" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">seam：before_model / pre_tool / post_tool / proxy</tspan></text><rect x="70" y="504" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="546" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">representation + correlation</tspan></text><line x1="100" y1="562" x2="940" y2="562" stroke="#d8e3ed"/><circle cx="107" cy="579" r="4" fill="#1689a7"/><text x="122" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">input_media_type：源表示，Provider 集成必须映射</tspan></text><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">session_id / tool_use_id：可选 scope 关联</tspan></text><circle cx="107" cy="661" r="4" fill="#1689a7"/><text x="122" y="668" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">tool_name / content_origin：可选工具与来源</tspan></text><rect x="70" y="723" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="765" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">capabilities · native 可选</tspan></text><line x1="100" y1="781" x2="940" y2="781" stroke="#d8e3ed"/><circle cx="107" cy="798" r="4" fill="#1689a7"/><text x="122" y="805" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">capabilities 对象及三个布尔字段在 native Schema 中均可选</tspan></text><circle cx="107" cy="839" r="4" fill="#1689a7"/><text x="122" y="846" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">replace_output=true / publish_retrieve_tool=false：PoC manifest 注入常量</tspan></text><circle cx="107" cy="880" r="4" fill="#1689a7"/><text x="122" y="887" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">replace_with_text：PoC manifest 从 allow_text_reencoding 映射</tspan></text><rect x="1010" y="244" width="520" height="331" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">input_media_type 把 representation contract</tspan><tspan x="1058" dy="27">传到真实 Provider</tspan></text><circle cx="1043" cy="387" r="4" fill="#16845b"/><text x="1058" y="394" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">agent_id 使用 admitted const，不再混用</tspan><tspan x="1058" dy="27">EnvironmentId</tspan></text><circle cx="1043" cy="455" r="4" fill="#16845b"/><text x="1058" y="462" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">顶层与 capabilities 均拒绝未知字段</tspan></text><circle cx="1043" cy="496" r="4" fill="#16845b"/><text x="1058" y="503" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">manifest 通过声明式映射注入字段，Host 无</tspan><tspan x="1058" dy="27">Tokenless 特判</tspan></text><rect x="1010" y="599" width="520" height="385" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="641" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="657" x2="1504" y2="657" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="674" r="4" fill="#b76308"/><text x="1058" y="681" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">agent_id、session_id、tool_use_id 与 tool_name</tspan><tspan x="1058" dy="27">只有最小长度，native Schema 上界仍不统一</tspan></text><circle cx="1043" cy="742" r="4" fill="#b76308"/><text x="1058" y="749" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">native Schema 允许 capabilities</tspan><tspan x="1058" dy="27">缺失或部分提供；PoC AW 路径依赖 manifest</tspan><tspan x="1058" dy="27">补齐常量</tspan></text><circle cx="1043" cy="837" r="4" fill="#b76308"/><text x="1058" y="844" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Tokenless 自身旧 adapter 可省略</tspan><tspan x="1058" dy="27">input_media_type；AW manifest 路径不会省略</tspan></text><circle cx="1043" cy="905" r="4" fill="#b76308"/><text x="1058" y="912" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">native attribution 名称与 AW actor/environment</tspan><tspan x="1058" dy="27">scope 仍需在文档中严格区分</tspan></text></g>
  <text x="70" y="1124" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">providers/tokenless/schemas/tokenless-compression-request-v1.schema.json</tspan></text>
  <text x="70" y="1187" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">物理副本：无</tspan></text>
  <text x="1530" y="1187" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR 42d07649 + PoC 5ebfc0b3 · 绿色=当前合理，橙色=仍需讨论</tspan></text>
</svg>
