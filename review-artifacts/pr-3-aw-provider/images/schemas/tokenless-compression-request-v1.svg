<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1098" viewBox="0 0 1600 1098" role="img" aria-labelledby="title desc">
  <title id="title">Tokenless CompressionRequest/v1</title>
  <desc id="desc">字段、语义、合理点和讨论点。审查固定到 42d07649409ecd5bb023056b28545efbd9325ef2。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d8498" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1600" height="1098" fill="url(#bg)"/>
  <rect x="38" y="32" width="1524" height="1034" rx="26" fill="#ffffff" fill-opacity="0.56" stroke="#c4d5e5" stroke-width="2"/>
  <text x="70" y="82" fill="#17283b" font-size="34" font-weight="750" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Tokenless CompressionRequest/v1</tspan></text>
  <text x="70" y="122" fill="#087d9b" font-size="19" font-weight="650" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">Provider native · Tokenless</tspan></text>
  <text x="70" y="165" fill="#465d73" font-size="20" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">向 tokenless compress 提交原文、调用边界和允许的替换能力。</tspan></text>
  <line x1="70" y1="198" x2="1530" y2="198" stroke="#cbd9e6" stroke-width="2"/>
  <g filter="url(#shadow)"><rect x="70" y="244" width="900" height="236" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="286" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">required</tspan></text><line x1="100" y1="302" x2="940" y2="302" stroke="#d8e3ed"/><circle cx="107" cy="319" r="4" fill="#1689a7"/><text x="122" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">protocol_version：固定为 1</tspan></text><circle cx="107" cy="360" r="4" fill="#1689a7"/><text x="122" y="367" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content：待处理正文</tspan></text><circle cx="107" cy="401" r="4" fill="#1689a7"/><text x="122" y="408" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">agent_id：Tokenless attribution 名称</tspan></text><circle cx="107" cy="442" r="4" fill="#1689a7"/><text x="122" y="449" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">seam：before_model / pre_tool / post_tool / proxy</tspan></text><rect x="70" y="504" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="546" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">correlation</tspan></text><line x1="100" y1="562" x2="940" y2="562" stroke="#d8e3ed"/><circle cx="107" cy="579" r="4" fill="#1689a7"/><text x="122" y="586" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">session_id / tool_use_id：可选关联</tspan></text><circle cx="107" cy="620" r="4" fill="#1689a7"/><text x="122" y="627" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">tool_name：可选工具名</tspan></text><circle cx="107" cy="661" r="4" fill="#1689a7"/><text x="122" y="668" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">content_origin：可选来源</tspan></text><rect x="70" y="723" width="900" height="195" rx="18" fill="#ffffff" stroke="#c8d8e8" stroke-width="2"/><text x="100" y="765" fill="#126f8a" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="100" dy="0">capabilities</tspan></text><line x1="100" y1="781" x2="940" y2="781" stroke="#d8e3ed"/><circle cx="107" cy="798" r="4" fill="#1689a7"/><text x="122" y="805" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">replace_output：可否替换原文</tspan></text><circle cx="107" cy="839" r="4" fill="#1689a7"/><text x="122" y="846" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">publish_retrieve_tool：可否提供取回工具</tspan></text><circle cx="107" cy="880" r="4" fill="#1689a7"/><text x="122" y="887" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="122" dy="0">replace_with_text：可否改成文本表示</tspan></text><rect x="1010" y="244" width="520" height="263" rx="18" fill="#edf9f3" stroke="#16845b" stroke-width="2"/><text x="1036" y="286" fill="#16845b" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">当前合理</tspan></text><line x1="1036" y1="302" x2="1504" y2="302" stroke="#16845b" opacity="0.45"/><circle cx="1043" cy="319" r="4" fill="#16845b"/><text x="1058" y="326" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">把 Provider 自己需要的 seam 和 feature flags</tspan><tspan x="1058" dy="27">保留在 native 层</tspan></text><circle cx="1043" cy="387" r="4" fill="#16845b"/><text x="1058" y="394" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">AW 通过 declarative mapping 注入，不需要在 Host</tspan><tspan x="1058" dy="27">写 Tokenless 分支</tspan></text><circle cx="1043" cy="455" r="4" fill="#16845b"/><text x="1058" y="462" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">关联字段和算法输入分开</tspan></text><rect x="1010" y="531" width="520" height="331" rx="18" fill="#fff7e8" stroke="#b76308" stroke-width="2"/><text x="1036" y="573" fill="#b76308" font-size="24" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1036" dy="0">需要讨论或修复</tspan></text><line x1="1036" y1="589" x2="1504" y2="589" stroke="#b76308" opacity="0.45"/><circle cx="1043" cy="606" r="4" fill="#b76308"/><text x="1058" y="613" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">additionalProperties=true，很多字符串没有边界</tspan></text><circle cx="1043" cy="647" r="4" fill="#b76308"/><text x="1058" y="654" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">AW environment_id 被映射到 Tokenless</tspan><tspan x="1058" dy="27">agent_id，两者语义不同</tspan></text><circle cx="1043" cy="715" r="4" fill="#b76308"/><text x="1058" y="722" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">content_origin 在 Schema 中可选，但 manifest</tspan><tspan x="1058" dy="27">总是注入</tspan></text><circle cx="1043" cy="783" r="4" fill="#b76308"/><text x="1058" y="790" fill="#243447" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1058" dy="0">Schema 没有表达各 seam 下 capabilities</tspan><tspan x="1058" dy="27">的合法组合</tspan></text></g>
  <text x="70" y="977" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">providers/tokenless/schemas/tokenless-compression-request-v1.schema.json</tspan></text>
  <text x="70" y="1040" fill="#61758a" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="70" dy="0">物理副本：无</tspan></text>
  <text x="1530" y="1040" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR head 42d07649 · 绿色表示可保留，橙色表示冻结前需讨论</tspan></text>
</svg>
