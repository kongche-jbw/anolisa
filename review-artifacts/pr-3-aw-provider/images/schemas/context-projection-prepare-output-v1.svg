  <text x="1530" y="1133" fill="#61758a" font-size="14" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif"><tspan x="1530" dy="0">PR head 42d07649 · 绿色表示可保留，橙色表示冻结前需讨论</tspan></text>
