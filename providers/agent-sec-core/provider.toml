# AW Provider manifest for agent-sec-core security inspection.
#
# One Package, one executable, three Capabilities. The AW v1 manifest declares a
# single top-level [executable], so every Capability shares one command line and
# the requested operation is injected into the native request by each codec.
#
# The native protocol is agent-sec-core's own; the canonical Capability
# Contracts are separate and connected by json-map/v1.

api_version = "providers.agentic-os.sh/v1"
provider_id = "agent-sec-core"
provider_version = "0.11.0"
driver = "exec-json/v1"
lifecycle = "one_shot"

[executable]
command = "agent-sec-cli"
args = ["aw-provider"]

# The provider path deliberately bypasses the security middleware lifecycle, so
# it writes no SecurityEvent and no telemetry. These variables keep that true
# even if a future default changes, and they are asserted by a disk-snapshot
# end-to-end test rather than trusted.
[executable.environment]
AGENT_SEC_TELEMETRY_ENABLED = "0"
PYTHONDONTWRITEBYTECODE = "1"

# Measured cold start on the reference host is well under a second, but this is
# a Python process that parses its rule set on every call. The effective limit
# is the smallest of this value, the Core invocation budget, and the remaining
# deadline, so Core must raise its own ceiling to reach this one.
[limits]
wall_time_ms = 5000
input_bytes = 67108864
output_bytes = 1048576

[permissions]
network = "none"
inherit_environment = false
filesystem_read = []
filesystem_write = []

[data]
reads = ["model_visible_context"]
writes = []
sensitivity = "inherits_input"
retention = "none"
telemetry = "disabled"

# ---------------------------------------------------------------------------
# security.content.inspect/v1 — Observe: secrets and personal data in content
# ---------------------------------------------------------------------------

[[capabilities]]
capability = "security.content.inspect/v1"
authority = "observe"
scopes = ["agent_session", "turn", "tool_call"]
input_contract = { schema = "security.content.inspect.input/v1", resource = "schemas/security-content-inspect-input-v1.schema.json", sha256 = "836231087cc27186746e4316e92dd842053b71ebc1e9f392d99f521adbdfcec4" }
output_contract = { schema = "security.content.inspect.output/v1", resource = "schemas/security-content-inspect-output-v1.schema.json", sha256 = "ff54d68d234e1e00926341ac499aa771a2697f6a2781617f16cc2e6bd3948449" }
native_input = { resource = "schemas/agent-sec-aw-provider-request-v1.schema.json", sha256 = "1ae16c55ddbe7c8242d9f44131889fe2937515021d03af36b74f0adb6b4672bd" }
native_output = { resource = "schemas/agent-sec-aw-provider-response-v1.schema.json", sha256 = "39b5a901f2004b51f76cf914adfcf2e15c184a3ba964b674d9720790d1c356d2" }

[capabilities.codec]
kind = "json-map/v1"

[[capabilities.codec.request.fields]]
target = "/protocol_version"
source = { kind = "const", value = 1 }
on_missing = "reject"

[[capabilities.codec.request.fields]]
target = "/operation"
source = { kind = "const", value = "content_inspect" }
on_missing = "reject"

[[capabilities.codec.request.fields]]
target = "/content"
source = { kind = "input", pointer = "/artifact/content" }
on_missing = "reject"

[[capabilities.codec.request.fields]]
target = "/source"
source = { kind = "const", value = "tool_output" }
on_missing = "reject"

[[capabilities.codec.request.fields]]
target = "/include_low_confidence"
source = { kind = "input", pointer = "/constraints/include_low_confidence" }
on_missing = "reject"

[capabilities.codec.response.disposition]
source = "/disposition"
on_unknown = "fail"

[capabilities.codec.response.disposition.values]
completed = "produced"
skipped = "bypassed"
error = "failed"

[[capabilities.codec.response.correlations]]
request_pointer = "/operation"
response_pointer = "/operation"

[[capabilities.codec.response.output_fields]]
target = "/inspection/verdict"
source = { kind = "response", pointer = "/verdict" }
when_disposition = ["produced"]

[[capabilities.codec.response.output_fields]]
target = "/inspection/findings"
source = { kind = "response", pointer = "/findings" }
when_disposition = ["produced"]

[[capabilities.codec.response.output_fields]]
target = "/inspection/scanned_bytes"
source = { kind = "response", pointer = "/scanned_bytes" }
when_disposition = ["produced"]

[[capabilities.codec.response.output_fields]]
target = "/inspection/truncated"
source = { kind = "response", pointer = "/truncated" }
when_disposition = ["produced"]

[[capabilities.codec.response.meters]]
meter_id = "security.findings_total"
unit = "findings"
measurement_kind = "observed"
value_pointer = "/findings_total"

[[capabilities.codec.response.meters]]
meter_id = "security.scanned_bytes"
unit = "bytes"
measurement_kind = "observed"
value_pointer = "/scanned_bytes"

