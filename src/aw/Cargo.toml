[workspace]
members = [
    "crates/aw-cosh-hook",
    "crates/aw-core",
    "crates/aw-contracts",
    "crates/aw-ledger",
    "crates/aw-provider-host",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/alibaba/anolisa"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.53", default-features = false }
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
