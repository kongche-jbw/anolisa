[workspace]
members = [
    ".",
    "crates/aw-core",
    "crates/aw-adapters",
    "crates/aw-sec-core",
    "crates/aw-sec-host",
    "crates/aw-hook-cli",
    "crates/aw-host-process",
    "crates/aw-tokenless-host",
]
resolver = "2"

[workspace.dependencies]
aw-contracts = { path = "." }
aw-core = { path = "crates/aw-core" }
aw-adapters = { path = "crates/aw-adapters" }
aw-sec-core = { path = "crates/aw-sec-core" }
aw-sec-host = { path = "crates/aw-sec-host" }
aw-host-process = { path = "crates/aw-host-process" }
aw-tokenless-host = { path = "crates/aw-tokenless-host" }
tokenless-protocol = { path = "../tokenless/crates/tokenless-protocol" }
libc = "0.2"
jsonschema = { version = "0.53", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[package]
name = "aw-contracts"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Versioned AW capability contracts and offline conformance validation"
repository = "https://github.com/alibaba/anolisa"
publish = false

[dependencies]
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
