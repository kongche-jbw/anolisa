# Experimental common policy for all four frameworks, with native scheduling.
# Replace the Provider path with its absolute installed location before running.
apiVersion: aw/v1alpha1
kind: AWConfiguration
metadata:
  name: common-tool-policy
spec:
  daemon:
    startup: on_demand
    endpoint: auto
    state_dir: auto
  execution:
    guarantee: native_hook
    default_event_budget_ms: 5000
  audit:
    enabled: true
    payload: metadata_only
  agents:
    qoder: {adapter: qoder, argv: [qodercli]}
    openclaw: {adapter: openclaw, argv: [openclaw, gateway, run]}
    hermes: {adapter: hermes, argv: [hermes]}
    qwenpaw: {adapter: qwenpaw, argv: [qwenpaw, app, --host, 127.0.0.1]}
  providers:
    policy:
      protocol: aw-provider/v1alpha1
      transport:
        type: stdio
        location: agent
        argv: [python3, /absolute/path/ANOLISA/src/aw/examples/providers/policy.py]
      timeout_ms: 5000
      max_output_bytes: 65536
      config:
        blocked_tools: []
        blocked_substrings: [AW_DENY_FIXTURE]
  events:
    tool.before:
      enabled: true
      required: true
      match: {tools: ['*']}
      steps:
      - id: check-tool
        provider: policy
        operation: check
        effects: [observe, block]
        on_error: block
    tool.after:
      enabled: true
      required: true
      match: {tools: ['*']}
      steps:
      - id: record-result
        provider: policy
        operation: record
        effects: [observe]
        on_error: report
