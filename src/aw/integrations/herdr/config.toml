onboarding = false

[server]
headless_cols = 120
headless_rows = 40

[terminal]
default_shell = "/bin/bash"
shell_mode = "non_login"

[update]
version_check = false
manifest_check = false

[ui]
sidebar_width = 48
sidebar_min_width = 42
sidebar_max_width = 64
sidebar_start_collapsed = false
agent_panel_sort = "spaces"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "agent", bold = true, fg = "#cdd6f4", dim = false }, "state_text"],
  [{ token = "$aw", bold = true, fg = "#cdd6f4", dim = false }],
  [{ token = "$aw_sec", fg = "#a6e3a1", dim = false }],
  [{ token = "$aw_sec_result", fg = "#cdd6f4", dim = false }],
  [{ token = "$aw_tokenless", fg = "#89b4fa", dim = false }],
  [{ token = "$aw_tokenless_result", fg = "#cdd6f4", dim = false }],
  [{ token = "$aw_savings", fg = "#f9e2af", bold = true, dim = false }],
  [{ token = "$aw_usage", fg = "#bac2de", dim = false }],
]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]
