onboarding = false

[server]
headless_cols = 120
headless_rows = 40

[terminal]
default_shell = "/bin/bash"
shell_mode = "non_login"

[update]
version_check = false
manifest_check = false

[ui]
sidebar_width = 44
sidebar_min_width = 36
sidebar_max_width = 52
sidebar_start_collapsed = false
agent_panel_sort = "spaces"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "agent", bold = true }, "state_text"],
  [{ token = "$aw", bold = true }],
  ["$aw_sec"],
  ["$aw_tokenless"],
  ["$aw_usage"],
]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]
