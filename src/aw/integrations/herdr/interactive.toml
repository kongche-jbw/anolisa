# Workspace summary covers currently running Agents; paired events share a row.
# The workspace title remains visible when metadata expires.
# Agent activity is a callback hint, not proof of adoption.

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", fg = "#7dcfff", bold = true }],
  [{ token = "$aw_ws_agents", fg = "#a9b1d6", rules = [{ contains = "ALERT", fg = "#f7768e" }, { contains = "overflow", fg = "#f7768e" }, { contains = "unavailable", fg = "#f7768e" }, { contains = "partial", fg = "#e0af68" }, { contains = "GAP!", fg = "#f7768e" }, { contains = "WAIT", fg = "#e0af68" }, { contains = "not wired", fg = "#565f89" }, { contains = "off", fg = "#565f89" }, { contains = "seen ", fg = "#7dcfff" }] }],
