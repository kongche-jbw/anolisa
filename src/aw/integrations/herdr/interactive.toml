# Merge these rows into the operator's existing Herdr v0.9.0 configuration.
# Use the aw-enabled cosh binary as terminal.default_shell to bind pane ownership.
# Workspace evidence remains visible when the Agent runs on cosh's nested PTY.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "state_text"],
  [{ token = "$aw", bold = true }],
  [{ token = "$aw_observation" }],
  [{ token = "$aw_security" }],
  [{ token = "$aw_projection" }],
  [{ token = "$aw_coverage" }],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "state_text"],
  [{ token = "$aw", bold = true }],
  [{ token = "$aw_observation" }],
  [{ token = "$aw_security" }],
  [{ token = "$aw_projection" }],
  [{ token = "$aw_coverage" }],
]
