[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "agent", fg = "#bb9af7", bold = true }, { token = "state_text", bold = true, rules = [{ equals = "working", ignore_case = true, fg = "#7aa2f7" }, { equals = "blocked", ignore_case = true, fg = "#e0af68" }, { equals = "idle", ignore_case = true, fg = "#9ece6a" }, { equals = "done", ignore_case = true, fg = "#9ece6a" }, { equals = "unknown", ignore_case = true, fg = "#a9b1d6" }] }],
  [{ token = "workspace", fg = "#7dcfff" }, "pane"],
  [{ token = "$aw_event_03", fg = "#a9b1d6", rules = [{ contains = "GAP!", fg = "#f7768e", bold = true }, { contains = "unavailable", fg = "#f7768e", bold = true }, { contains = "failed", fg = "#f7768e", bold = true }, { contains = "pending", fg = "#e0af68" }, { contains = "deny 0", fg = "#9ece6a" }, { contains = "deny ", fg = "#f7768e", bold = true }, { contains = "seen ", fg = "#7dcfff" }] }],
  [{ token = "$aw_event_04", fg = "#a9b1d6", rules = [{ contains = "GAP!", fg = "#f7768e", bold = true }, { contains = "unavailable", fg = "#f7768e", bold = true }, { contains = "failed", fg = "#f7768e", bold = true }, { contains = "pending", fg = "#e0af68" }, { contains = "deny 0", fg = "#9ece6a" }, { contains = "deny ", fg = "#f7768e", bold = true }, { contains = "seen ", fg = "#7dcfff" }] }],
